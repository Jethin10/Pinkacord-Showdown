services:
  - type: web
    name: pinkacord
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PINKACORD_HOSTED
        value: "1"
      - key: PINKACORD_LOW_MEMORY
        value: "1"
      - key: PINKACORD_ADMIN_PASSWORD
        sync: false
      - key: PINKACORD_ADMIN_PORT
        value: "8001"
      - key: PINKACORD_ADMIN_BIND
        value: "127.0.0.1"
      - key: PINKACORD_GITHUB_REPO
        value: Jethin10/Pinkacord-Showdown
      - key: PINKACORD_GITHUB_BRANCH
        value: main
      - key: PINKACORD_GITHUB_TOKEN
        sync: false
